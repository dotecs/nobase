<title>판별식 시각 레슨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one lesson = vertical sequence of scenes; each scene is a card with a visual stage (left/top) and a narration rail (right/bottom). Standard graph lives in the stage. */
:root{
  --bg:#f6f9fc; --surface:#ffffff; --surface-2:#eef4f9; --fg:#0f172a; --fg-2:#475569; --fg-3:#64748b;
  --line:#dbe4ee; --line-2:#eef2f7;
  --brand:#0072c6; --brand-2:#005fa6; --brand-soft:#e6f3fb;
  --teal:#00a8a8; --teal-soft:#e6f7f7;
  --warn:#d97706; --warn-soft:#fef3c7;
  --ok:#059669; --ok-soft:#d1fae5;
  --think:#7c3aed; --think-soft:#f3e8ff;
  --focus:0 0 0 3px rgba(0,114,198,.35);
  --font:'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono','Consolas',monospace;
  --radius:20px; --radius-s:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#111a2b; --surface-2:#18233a; --fg:#f1f5f9; --fg-2:#cbd5e1; --fg-3:#94a3b8;
  --line:#2a3650; --line-2:#1f2a40; --brand:#4ea8e8; --brand-2:#7cc0f0; --brand-soft:#0f2a44; --teal:#33bfbf; --teal-soft:#0e2d2d;
  --warn:#fbbf24; --warn-soft:#3a2a08; --ok:#34d399; --ok-soft:#0a2e22; --think:#c4b5fd; --think-soft:#2a1f4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#111a2b; --surface-2:#18233a; --fg:#f1f5f9; --fg-2:#cbd5e1; --fg-3:#94a3b8;
  --line:#2a3650; --line-2:#1f2a40; --brand:#4ea8e8; --brand-2:#7cc0f0; --brand-soft:#0f2a44; --teal:#33bfbf; --teal-soft:#0e2d2d;
  --warn:#fbbf24; --warn-soft:#3a2a08; --ok:#34d399; --ok-soft:#0a2e22; --think:#c4b5fd; --think-soft:#2a1f4a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));word-break:keep-all;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:22px 10px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--brand);font-weight:700}
h1{font-size:clamp(22px,3.2vw,30px);margin:0;text-wrap:balance}
.meta{color:var(--fg-3);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--fg-2);font-weight:600}
.controls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;min-height:40px}
button:focus-visible{outline:none;box-shadow:var(--focus)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.scenes{display:grid;gap:18px}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;scroll-margin-top:12px}
.scene.active{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
@media (max-width:760px){.scene{grid-template-columns:1fr;padding:16px}}
.stage{min-width:0;display:grid;gap:12px;align-content:start}
.rail{min-width:0;display:grid;gap:12px;align-content:start}
.scene-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-family:var(--mono);font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.scene h2{font-size:18px;margin:0}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;letter-spacing:.04em}
.tag.translate{background:var(--teal-soft);color:var(--teal)}
.tag.derive{background:var(--brand-soft);color:var(--brand)}
.tag.check{background:var(--ok-soft);color:var(--ok)}
.tag.explore{background:var(--warn-soft);color:var(--warn)}
/* narration */
.narr{display:grid;gap:8px}
.line{padding:10px 12px;border-radius:var(--radius-s);border:1px solid transparent;color:var(--fg-2);font-size:15px;transition:background .25s,border-color .25s,color .25s}
.line.now{background:var(--brand-soft);border-color:var(--brand);color:var(--fg)}
.line .lbl{display:block;font-size:11px;letter-spacing:.08em;font-weight:700;margin-bottom:2px}
.line.think .lbl{color:var(--think)} .line.write .lbl{color:var(--brand)} .line.say .lbl{color:var(--teal)}
.play{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.play small{color:var(--fg-3)}
/* steps (derivation) */
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--radius-s);border:1px solid var(--line-2);background:var(--surface-2);opacity:.42;transform:translateY(4px);transition:opacity .35s,transform .35s,border-color .35s}
.step.on{opacity:1;transform:none}
.step.now{border-color:var(--brand);background:var(--brand-soft)}
.step .k{font-family:var(--mono);font-size:12px;color:var(--fg-3);text-align:right}
.step .m{min-width:0;overflow-x:auto;font-size:18px}
.why{font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);border-radius:999px;padding:4px 10px;min-height:32px;white-space:nowrap}
.why[aria-expanded="true"]{background:var(--think-soft);border-color:var(--think);color:var(--think)}
.whybox{grid-column:1/-1;font-size:14px;color:var(--fg-2);padding:8px 10px 2px;border-top:1px dashed var(--line)}
.whybox b{color:var(--think)}
/* standard graph */
.graph{width:100%;max-width:100%;aspect-ratio:16/10;display:block;background:var(--surface-2);border-radius:var(--radius-s);border:1px solid var(--line-2)}
.graph .grid{stroke:var(--line);stroke-width:1}
.graph .axis{stroke:var(--fg-2);stroke-width:1.6}
.graph .tick{fill:var(--fg-3);font-size:11px;font-family:var(--mono)}
.graph .lab{fill:var(--fg-2);font-size:13px;font-family:var(--font);font-weight:600}
.graph .curve{fill:none;stroke-width:2.6;stroke-linecap:round}
.graph .c1{stroke:var(--brand)} .graph .c2{stroke:var(--teal)} .graph .c3{stroke:var(--warn)}
.graph .pt{stroke:var(--surface);stroke-width:2}
.graph .pt.c1{fill:var(--brand)} .graph .pt.c2{fill:var(--teal)} .graph .pt.c3{fill:var(--warn)}
.graph .band{fill:var(--ok);opacity:.12}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend .c1{background:var(--brand)} .legend .c2{background:var(--teal)} .legend .c3{background:var(--warn)}
/* slider */
.slider{display:grid;gap:6px;padding:12px;border-radius:var(--radius-s);background:var(--surface-2);border:1px solid var(--line-2)}
.slider label{display:flex;justify-content:space-between;font-size:14px;color:var(--fg-2)}
.slider output{font-family:var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--brand)}
.verdict{font-size:15px;font-weight:600;padding:8px 12px;border-radius:var(--radius-s);background:var(--brand-soft);color:var(--fg)}
.verdict.d0{background:var(--warn-soft)} .verdict.dneg{background:var(--ok-soft)}
/* table */
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;color:var(--fg-3);font-weight:700}
td .mj{font-size:16px}
.tbl-wrap{overflow-x:auto}
.kind{font-weight:700}
.kind.pos{color:var(--brand)} .kind.zero{color:var(--warn)} .kind.neg{color:var(--ok)}
/* chain (translation) */
.chain{display:grid;gap:4px}
.chain .node{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius-s);border:1px solid var(--line-2);background:var(--surface-2);font-size:15px;opacity:.42;transition:opacity .3s,border-color .3s}
.chain .node.on{opacity:1}.chain .node.now{border-color:var(--teal);background:var(--teal-soft)}
.chain .arrow{color:var(--fg-3);font-size:13px;padding-left:14px}
.chain .node .mj{font-size:16px}
/* quiz */
.quiz{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border-radius:var(--radius-s);padding:10px 12px}
.opt[data-state="right"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[data-state="wrong"]{border-color:var(--warn);background:var(--warn-soft)}
.trace{display:grid;gap:6px;border:1px dashed var(--line);border-radius:var(--radius-s);padding:12px}
.trace .q{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.trace .q .btns{display:flex;gap:6px;margin-left:auto}
.trace .q button{min-height:32px;padding:4px 10px;font-size:13px}
.trace .found{font-size:14px;color:var(--fg);background:var(--think-soft);border-radius:var(--radius-s);padding:8px 10px}
.trace .found b{color:var(--think)}
.note{font-size:13px;color:var(--fg-3)}
.mj svg{vertical-align:-.2em;max-width:100%}
footer{color:var(--fg-3);font-size:12px;padding-block:24px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <div>
    <div class="eyebrow">뿌리깊은수학 · 11강</div>
    <h1>이차방정식의 판별식</h1>
    <div class="meta"><span>장면 <b>7</b></span><span>소요 <b>약 9분</b></span><span>근거 개념 <b>등식의 성질 · 완전제곱식 · 분수의 성질 · 제곱근의 성질</b></span></div>
  </div>
  <div class="controls">
    <button id="playAll" class="primary" type="button">▶ 처음부터 재생</button>
    <button id="stopAll" type="button">■ 멈춤</button>
    <button id="voiceToggle" type="button" aria-pressed="true">음성 켜짐</button>
  </div>
</header>

<div class="scenes" id="scenes"></div>

<footer>시제품: 음성은 브라우저 내장 TTS(한국어 음성이 설치된 기기에서만 들립니다). 제작 버전은 ElevenLabs 음성 파일로 교체되고, 그래프·수식·자막은 같은 레슨 JSON에서 그려집니다.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
<script>
// ---------- Lesson data (this JSON shape is the production format) ----------
const LESSON = {
  id: 'rm-11', title: '이차방정식의 판별식',
  scenes: [
    { id:'s1', kind:'translate', title:'근을 구하지 않고 근의 개수를 알 수 있을까?',
      stage:{ type:'graph', x:[-4,4], y:[-5,7],
        fns:[{f:x=>x*x+x-3, c:'c1', label:'y=x²+x−3'},{f:x=>9*x*x-6*x+1, c:'c2', label:'y=9x²−6x+1'},{f:x=>2*x*x+x+3, c:'c3', label:'y=2x²+x+3'}],
        points:[{x:(-1+Math.sqrt(13))/2,y:0,c:'c1'},{x:(-1-Math.sqrt(13))/2,y:0,c:'c1'},{x:1/3,y:0,c:'c2'}] },
      narration:[
        {role:'say', text:'이차방정식을 풀 때, 실제로 근을 구하기 전에 "이 방정식은 근이 몇 개일까"를 먼저 알고 싶을 때가 많습니다.'},
        {role:'think', text:'이차방정식의 실근은 이차함수 그래프가 x축과 만나는 점의 x좌표입니다. 그러니까 "근이 몇 개냐"는 "그래프가 x축과 몇 번 만나냐"와 같은 말입니다.'},
        {role:'say', text:'파란 그래프는 두 번, 청록 그래프는 한 번 스치고, 주황 그래프는 x축 위에 떠서 한 번도 만나지 않습니다. 이 셋을 구분해 주는 숫자 하나를 오늘 배웁니다.'}
      ]},
    { id:'s2', kind:'derive', title:'근의 공식을 다시 유도하며 "루트 안"을 찾는다',
      stage:{ type:'steps', steps:[
        {tex:'ax^2+bx+c=0\\quad(a\\neq0)', why:null, think:'이차항 계수가 1이면 완전제곱식을 만들기 쉽다. 그래서 먼저 a로 나눈다.'},
        {tex:'x^2+\\tfrac{b}{a}x+\\tfrac{c}{a}=0', why:'등식의 성질', whyText:'등식의 양변을 0이 아닌 같은 수로 나누어도 등식은 성립한다. 여기서는 양변을 a로 나누었다(a≠0).', think:'적을 것: 양변 ÷ a'},
        {tex:'x^2+\\tfrac{b}{a}x=-\\tfrac{c}{a}', why:'등식의 성질', whyText:'양변에서 같은 수(c/a)를 빼면 등식은 성립한다. "이항"은 이 성질의 줄임말이다.', think:'상수항을 오른쪽으로 보내 x가 있는 항만 왼쪽에 남긴다.'},
        {tex:'x^2+\\tfrac{b}{a}x+\\left(\\tfrac{b}{2a}\\right)^2=-\\tfrac{c}{a}+\\left(\\tfrac{b}{2a}\\right)^2', why:'완전제곱식', whyText:'x²+px 에 (p/2)²을 더하면 (x+p/2)²이 된다. 일차항 계수 b/a의 절반 b/2a를 제곱해 양변에 더했다.', think:'머릿속: "일차항 계수의 절반을 제곱해서 더한다". 이게 이 유도의 핵심 수다.'},
        {tex:'\\left(x+\\tfrac{b}{2a}\\right)^2=\\tfrac{b^2-4ac}{4a^2}', why:'분수의 성질', whyText:'우변 두 분수를 분모 4a²으로 통분했다: −c/a = −4ac/4a². 그러면 (b²−4ac)/4a²가 된다.', think:'좌변은 완전제곱식으로 묶고, 우변은 통분해서 한 덩어리로.'},
        {tex:'x+\\tfrac{b}{2a}=\\pm\\sqrt{\\tfrac{b^2-4ac}{4a^2}}', why:'제곱근의 성질', whyText:'X²=k (k≥0) 이면 X=±√k. 여기서 k는 우변 전체다. 제곱해서 음수가 되는 실수는 없으므로 k≥0일 때만 실수 범위에서 풀 수 있다.', think:'여기서 멈춰야 한다. 우변이 음수면 제곱근을 씌울 수 없다. 즉 루트 안의 부호가 "실근이 있느냐"를 결정한다.'},
        {tex:'x=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}', why:'등식의 성질', whyText:'√(4a²)=2|a| 이므로 분모로 2a를 빼내고(±가 흡수), b/2a를 이항했다.', think:'적을 것: 근의 공식. 계수 a, b, c만 알면 근을 언제나 쓸 수 있다.'}
      ]},
      narration:[
        {role:'say', text:'판별식은 근의 공식 안에 숨어 있습니다. 그래서 근의 공식을 한 번 더 유도하면서, 어느 단계에서 "실근이 있다/없다"가 갈리는지 찾아보겠습니다.'},
        {role:'write', text:'각 줄의 오른쪽에 있는 보라색 칩이 그 줄로 넘어가는 수학적 근거입니다. 근거가 낯설면 칩을 눌러 보세요. 학생 화면에서는 이 칩이 "모르겠어요" 버튼이 됩니다.'},
        {role:'think', text:'여섯 번째 줄이 핵심입니다. 제곱근을 씌우려면 루트 안이 0 이상이어야 합니다. 루트 안에 들어 있는 식, b²−4ac. 이것이 오늘의 주인공입니다.'}
      ]},
    { id:'s3', kind:'translate', title:'루트 안의 식에 이름을 붙인다: 판별식 D',
      stage:{ type:'chain', nodes:[
        {tex:'D=b^2-4ac', text:'근의 공식에서 √ 안에 있던 식. Discriminant의 D.'},
        {tex:'D>0', text:'√D가 양수 → ±√D 로 두 값이 갈라진다 → 서로 다른 두 실근'},
        {tex:'D=0', text:'√D=0 → ±0 이라 갈라지지 않는다 → 두 근이 겹친다 = 중근'},
        {tex:'D<0', text:'√(음수)는 실수가 아니다 → 실근 없음'}
      ]},
      narration:[
        {role:'say', text:'루트 안의 식 b²−4ac를 판별식이라 하고, Discriminant의 머리글자를 따서 D라고 씁니다.'},
        {role:'think', text:'근의 공식의 모양을 떠올리세요. −b/2a 라는 가운데 값에서 ±√D 만큼 양옆으로 벌어져 두 근이 생깁니다. 그래서 D가 양수면 두 개, 0이면 벌어지지 않아 하나로 겹치고, 음수면 벌어질 수가 없어 실근이 없습니다.'},
        {role:'write', text:'적을 때는 세 줄이면 됩니다. D>0 서로 다른 두 실근, D=0 중근, D<0 실근 없음.'}
      ]},
    { id:'s4', kind:'explore', title:'D의 부호를 그래프로 번역한다',
      stage:{ type:'slider', a:1, b:2, cRange:[-4,5], c0:-3 },
      narration:[
        {role:'say', text:'슬라이더로 상수항 c를 바꿔 보세요. 이차식은 x²+2x+c 입니다.'},
        {role:'think', text:'번역 사슬입니다. "D<0" ⇔ "x²+2x+c=0 의 실근이 없다" ⇔ "그래프가 x축과 만나지 않는다" ⇔ (a>0이므로) "그래프 전체가 x축 위에 떠 있다" ⇔ "모든 x에 대해 x²+2x+c>0". 수식 한 줄과 그림 한 장이 같은 문장입니다.'},
        {role:'write', text:'c=1에서 D=0이 되어 그래프가 x축에 딱 닿습니다. 그보다 c가 크면 떠오르고, 작으면 x축을 뚫고 내려갑니다.'}
      ]},
    { id:'s5', kind:'check', title:'근을 구하지 않고 판별만 해 본다',
      stage:{ type:'table', rows:[
        {eq:'x^2+x-3=0', d:'1^2-4\\cdot1\\cdot(-3)=13', sign:'pos', kind:'서로 다른 두 실근'},
        {eq:'9x^2-6x+1=0', d:'(-6)^2-4\\cdot9\\cdot1=0', sign:'zero', kind:'중근'},
        {eq:'2x^2+x+3=0', d:'1^2-4\\cdot2\\cdot3=-23', sign:'neg', kind:'실근 없음'}
      ]},
      narration:[
        {role:'say', text:'첫 장면의 세 그래프가 바로 이 세 방정식입니다. 근은 구하지 않고 판별식만 계산합니다.'},
        {role:'think', text:'a, b, c를 읽어 D=b²−4ac에 넣는 것뿐입니다. b가 음수여도 제곱하므로 (−6)²=36처럼 부호는 사라집니다.'},
        {role:'write', text:'13>0 두 실근, 0 중근, −23<0 실근 없음. 첫 장면의 그래프가 x축과 두 번, 한 번, 0번 만난 것과 정확히 맞습니다.'}
      ]},
    { id:'s6', kind:'derive', title:'일차항 계수가 짝수면: 짝수 공식',
      stage:{ type:'steps', steps:[
        {tex:"b=2b'\\ \\text{라 두면}", why:null, think:'일차항 계수가 짝수면 b를 2b′로 쓸 수 있다. 계산이 줄어든다.'},
        {tex:"x=\\dfrac{-2b'\\pm\\sqrt{4b'^2-4ac}}{2a}", why:'대입', whyText:'근의 공식의 b 자리에 2b′를 그대로 넣었다.', think:'적을 것: b 대신 2b′'},
        {tex:"x=\\dfrac{-2b'\\pm2\\sqrt{b'^2-ac}}{2a}", why:'제곱근의 성질', whyText:'√(4k)=2√k. 루트 안에서 공통인수 4를 묶어 밖으로 꺼냈다.', think:'루트 안에 4가 공통으로 있으면 2로 빠져나온다.'},
        {tex:"x=\\dfrac{-b'\\pm\\sqrt{b'^2-ac}}{a}", why:'분수의 성질', whyText:'분자·분모를 2로 약분했다.', think:'분자 전체에 2가 공통이므로 분모 2a와 약분.'}
      ]},
      narration:[
        {role:'say', text:'일차항 계수가 짝수일 때는 짝수 공식을 쓰면 수가 작아집니다. 새 공식이 아니라 근의 공식을 약분한 것입니다.'},
        {role:'think', text:'판별식도 같이 작아집니다. D/4 = b′²−ac. 부호만 보면 되므로 D 대신 D/4로 판별해도 결과는 같습니다.'}
      ]},
    { id:'s7', kind:'check', title:'확인: 어디까지 알고 있나',
      stage:{ type:'quiz',
        q:'x^2+3x+k=0 \\text{ 이 실근을 갖지 않도록 하는 } k \\text{의 범위는?}',
        options:[{t:'k<\\tfrac94',ok:false},{t:'k>\\tfrac94',ok:true},{t:'k\\le\\tfrac94',ok:false},{t:'k=\\tfrac94',ok:false}],
        explain:'실근이 없다 ⇔ D<0 ⇔ 9−4k<0 ⇔ k>9/4.',
        trace:[
          {q:'"실근이 없다"를 D<0 으로 바꿀 수 있나요?', concept:'판별식의 의미(11강)'},
          {q:'판별식 D=b²−4ac 가 근의 공식 어디에서 왔는지 아나요?', concept:'근의 공식(10·11강)'},
          {q:'이차방정식 x²+3x+k=0 에서 a, b, c를 읽을 수 있나요?', concept:'이차방정식의 꼴(10강)'},
          {q:'9−4k<0 을 k에 대해 풀 수 있나요?', concept:'부등식의 성질(6강)'}
        ]},
      narration:[
        {role:'say', text:'마지막으로 한 문제. 풀이의 첫 줄을 무엇으로 시작해야 할지 먼저 생각해 보세요.'},
        {role:'think', text:'첫 줄의 근거: "실근이 없다"는 말을 "D<0"으로 번역하는 것입니다. 이 번역이 안 되면 문제는 시작조차 되지 않습니다.'},
        {role:'write', text:'모르겠으면 "모르겠어요"를 누르세요. 시스템이 어느 개념에서 막혔는지 한 단계씩 되짚어 찾아냅니다.'}
      ]}
  ]
};

// ---------- Standard graph (SVG) ----------
function stdGraph(opts){
  const W=640,H=400,pad={l:36,r:16,t:14,b:28};
  const [x0,x1]=opts.x,[y0,y1]=opts.y;
  const sx=x=>pad.l+(x-x0)/(x1-x0)*(W-pad.l-pad.r), sy=y=>pad.t+(y1-y)/(y1-y0)*(H-pad.t-pad.b);
  let s=`<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.aria||'표준 그래프'}">`;
  for(let x=Math.ceil(x0);x<=x1;x++) s+=`<line class="grid" x1="${sx(x)}" y1="${pad.t}" x2="${sx(x)}" y2="${H-pad.b}"/>`;
  for(let y=Math.ceil(y0);y<=y1;y++) s+=`<line class="grid" x1="${pad.l}" y1="${sy(y)}" x2="${W-pad.r}" y2="${sy(y)}"/>`;
  if(opts.band){const [a,b]=opts.band; s+=`<rect class="band" x="${pad.l}" y="${sy(b)}" width="${W-pad.l-pad.r}" height="${Math.max(0,sy(a)-sy(b))}"/>`;}
  s+=`<line class="axis" x1="${pad.l}" y1="${sy(0)}" x2="${W-pad.r}" y2="${sy(0)}"/><polygon fill="currentColor" style="color:var(--fg-2)" points="${W-pad.r},${sy(0)} ${W-pad.r-9},${sy(0)-4} ${W-pad.r-9},${sy(0)+4}"/>`;
  s+=`<line class="axis" x1="${sx(0)}" y1="${H-pad.b}" x2="${sx(0)}" y2="${pad.t}"/><polygon fill="currentColor" style="color:var(--fg-2)" points="${sx(0)},${pad.t} ${sx(0)-4},${pad.t+9} ${sx(0)+4},${pad.t+9}"/>`;
  for(let x=Math.ceil(x0);x<=x1;x++) if(x!==0) s+=`<text class="tick" x="${sx(x)}" y="${sy(0)+14}" text-anchor="middle">${x}</text>`;
  for(let y=Math.ceil(y0);y<=y1;y++) if(y!==0) s+=`<text class="tick" x="${sx(0)-6}" y="${sy(y)+4}" text-anchor="end">${y}</text>`;
  s+=`<text class="tick" x="${sx(0)-6}" y="${sy(0)+14}" text-anchor="end">O</text>`;
  s+=`<text class="lab" x="${W-pad.r-4}" y="${sy(0)-8}" text-anchor="end">x</text><text class="lab" x="${sx(0)+8}" y="${pad.t+12}">y</text>`;
  for(const fn of opts.fns||[]){
    let d='',pen=false;
    for(let i=0;i<=400;i++){const x=x0+(x1-x0)*i/400,y=fn.f(x);
      if(y<y0-2||y>y1+2){pen=false;continue;}
      d+=(pen?'L':'M')+sx(x).toFixed(1)+' '+sy(y).toFixed(1)+' ';pen=true;}
    s+=`<path class="curve ${fn.c}" d="${d}"/>`;
  }
  for(const p of opts.points||[]) s+=`<circle class="pt ${p.c}" cx="${sx(p.x)}" cy="${sy(p.y)}" r="5.5"/>`;
  return s+'</svg>';
}
// ---------- Renderers ----------
const tex=t=>`<span class="mj">\\(${t}\\)</span>`;
function renderStage(sc){
  const st=sc.stage;
  if(st.type==='graph') return stdGraph(st)+`<div class="legend">${st.fns.map(f=>`<span><i class="${f.c}"></i>${f.label}</span>`).join('')}</div>`;
  if(st.type==='steps') return `<div class="steps">${st.steps.map((s,i)=>`<div class="step" data-i="${i}"><span class="k">${i+1}</span><div class="m">${tex(s.tex)}</div>${s.why?`<button class="why" type="button" aria-expanded="false" data-step="${i}">근거: ${s.why}</button>`:'<span></span>'}<div class="whybox" hidden><b>근거 · ${s.why||''}</b> ${s.whyText||''}<br><span style="color:var(--think);font-weight:700">머릿속</span> ${s.think}</div></div>`).join('')}</div><p class="note">줄이 하나씩 나타납니다. 보라색 칩은 그 줄로 넘어가는 수학적 근거이고, 누르면 "머릿속에서 생각할 것"도 함께 보입니다.</p>`;
  if(st.type==='chain') return `<div class="chain">${st.nodes.map((n,i)=>`${i?'<div class="arrow">↓</div>':''}<div class="node" data-i="${i}"><span class="mj">\\(${n.tex}\\)</span><span>${n.text}</span></div>`).join('')}</div>`;
  if(st.type==='slider') return `<div id="sl-graph"></div><div class="slider"><label for="cR">상수항 c <output id="cOut"></output></label><input id="cR" type="range" min="${st.cRange[0]}" max="${st.cRange[1]}" step="0.1" value="${st.c0}"><div id="verdict" class="verdict"></div></div>`;
  if(st.type==='table') return `<div class="tbl-wrap"><table><thead><tr><th>이차방정식</th><th>판별식 D=b²−4ac</th><th>근의 종류</th></tr></thead><tbody>${st.rows.map((r,i)=>`<tr data-i="${i}"><td>${tex(r.eq)}</td><td>${tex(r.d)}</td><td><span class="kind ${r.sign}">${r.kind}</span></td></tr>`).join('')}</tbody></table></div>`;
  if(st.type==='quiz') return `<div class="quiz"><div style="font-size:17px">${tex(st.q)}</div>${st.options.map((o,i)=>`<button class="opt" type="button" data-ok="${o.ok}">${tex(o.t)}</button>`).join('')}<div id="qExplain" class="note" hidden>${st.explain}</div><button id="dontknow" type="button">모르겠어요 — 어디서 막혔는지 찾기</button><div id="trace" class="trace" hidden></div></div>`;
  return '';
}
function renderScene(sc,i){
  return `<section class="scene" id="${sc.id}" data-i="${i}"><div class="stage"><div class="scene-head"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${sc.title}</h2><span class="tag ${sc.kind}">${{translate:'번역',derive:'유도',check:'확인',explore:'탐구'}[sc.kind]}</span></div>${renderStage(sc)}</div><div class="rail"><div class="play"><button type="button" class="playScene" data-i="${i}">▶ 이 장면 재생</button><small>${sc.narration.length}문장</small></div><div class="narr">${sc.narration.map((n,j)=>`<div class="line ${n.role}" data-j="${j}"><span class="lbl">${{say:'설명',think:'머릿속',write:'종이에'}[n.role]}</span>${n.text}</div>`).join('')}</div></div></section>`;
}
document.getElementById('scenes').innerHTML=LESSON.scenes.map(renderScene).join('');

// ---------- Interactions ----------
// derivation steps reveal progressively; "why" chips toggle justification
document.querySelectorAll('.steps').forEach(box=>{
  const steps=[...box.querySelectorAll('.step')]; let n=0;
  const show=k=>{steps.forEach((s,i)=>{s.classList.toggle('on',i<=k);s.classList.toggle('now',i===k);});};
  show(0);
  const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){const t=setInterval(()=>{n++;if(n>=steps.length){clearInterval(t);return;}show(n);},900);io.disconnect();}},{threshold:.4});
  io.observe(box);
  box.addEventListener('click',e=>{const b=e.target.closest('.why');if(!b)return;const row=b.closest('.step'),bx=row.querySelector('.whybox'),open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));bx.hidden=open;});
});
document.querySelectorAll('.chain').forEach(box=>{const nodes=[...box.querySelectorAll('.node')];let n=0;const show=k=>nodes.forEach((s,i)=>{s.classList.toggle('on',i<=k);s.classList.toggle('now',i===k);});show(0);
  const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){const t=setInterval(()=>{n++;if(n>=nodes.length){clearInterval(t);return;}show(n);},1100);io.disconnect();}},{threshold:.4});io.observe(box);});
// slider scene
(function(){
  const sc=LESSON.scenes.find(s=>s.stage.type==='slider'),st=sc.stage,g=document.getElementById('sl-graph'),r=document.getElementById('cR'),out=document.getElementById('cOut'),v=document.getElementById('verdict');
  const draw=()=>{const c=parseFloat(r.value),D=st.b*st.b-4*st.a*c;out.textContent=`c = ${c.toFixed(1)}   D = ${D.toFixed(1)}`;
    const pts=[];if(D>=0){const q=Math.sqrt(D);pts.push({x:(-st.b+q)/(2*st.a),y:0,c:'c1'});if(D>0)pts.push({x:(-st.b-q)/(2*st.a),y:0,c:'c1'});}
    g.innerHTML=stdGraph({x:[-5,3],y:[-5,7],fns:[{f:x=>st.a*x*x+st.b*x+c,c:'c1'}],points:pts,band:D<0?[0,7]:null,aria:`y=x²+2x+${c.toFixed(1)} 그래프`});
    v.className='verdict '+(D>0?'dpos':D===0?'d0':'dneg');
    v.textContent=D>0?`D>0 · x축과 두 점에서 만난다 → 서로 다른 두 실근`:D===0?`D=0 · x축에 접한다 → 중근`:`D<0 · x축 위에 떠 있다 → 실근 없음 (모든 x에서 식의 값이 양수)`;};
  r.addEventListener('input',draw);draw();
})();
// quiz + "don't know" trace
(function(){
  const sc=LESSON.scenes.find(s=>s.stage.type==='quiz'),st=sc.stage,box=document.getElementById(sc.id);
  box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{box.querySelectorAll('.opt').forEach(o=>o.dataset.state='');b.dataset.state=b.dataset.ok==='true'?'right':'wrong';document.getElementById('qExplain').hidden=false;}));
  const tr=document.getElementById('trace');let k=0;
  const ask=()=>{if(k>=st.trace.length){tr.innerHTML+=`<div class="found"><b>여기까지 모두 아는데 막혔다면</b> 아는 것을 "연결"하는 연습이 부족한 것입니다. 이 문제의 첫 줄 "실근 없음 ⇔ D<0"을 따라 써 보고 변형 문제로 넘어갑니다.</div>`;return;}
    const q=st.trace[k];const row=document.createElement('div');row.className='q';row.innerHTML=`<span>${q.q}</span><span class="btns"><button type="button" data-a="yes">네</button><button type="button" data-a="no">모르겠어요</button></span>`;tr.appendChild(row);
    row.querySelector('.btns').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;row.querySelector('.btns').remove();row.insertAdjacentHTML('beforeend',`<span style="color:var(--fg-3);margin-left:auto">${a==='yes'?'안다':'모른다'}</span>`);
      if(a==='no'){tr.innerHTML+=`<div class="found"><b>막힌 지점: ${q.concept}</b> — 이 개념 카드를 바로 열어 보고(제작 버전), 짧은 확인 문제 1개를 푼 뒤 원래 문제로 돌아옵니다. 코치 화면에는 "${q.concept}에서 끊김"으로 기록됩니다.</div>`;return;}
      k++;ask();},{once:true});};
  document.getElementById('dontknow').addEventListener('click',()=>{tr.hidden=false;tr.innerHTML='<div class="note">첫 줄의 근거부터 한 단계씩 되짚습니다. 질문은 보통 4개를 넘지 않습니다.</div>';k=0;ask();});
})();
// ---------- Narration (browser TTS, prototype) ----------
let voiceOn=true,speaking=false,queue=[];
const synth=window.speechSynthesis;
function pickVoice(){const vs=synth?synth.getVoices():[];return vs.find(v=>/ko/i.test(v.lang)&&/Google|Microsoft|Yuna|Heami|SunHi|InJoon/.test(v.name))||vs.find(v=>/ko/i.test(v.lang))||null;}
function clearNow(){document.querySelectorAll('.line.now').forEach(l=>l.classList.remove('now'));document.querySelectorAll('.scene.active').forEach(s=>s.classList.remove('active'));}
function speakLine(sceneIdx,j){return new Promise(res=>{const sc=document.querySelectorAll('.scene')[sceneIdx],line=sc.querySelectorAll('.line')[j];clearNow();sc.classList.add('active');line.classList.add('now');line.scrollIntoView({block:'nearest',behavior:'smooth'});
  // sync visuals with the narration line
  const steps=sc.querySelectorAll('.step');if(steps.length){const k=Math.min(steps.length-1,Math.round((j+1)/sc.querySelectorAll('.line').length*steps.length)-1);steps.forEach((s,i)=>{s.classList.toggle('on',i<=Math.max(k,0));s.classList.toggle('now',i===Math.max(k,0));});}
  const nodes=sc.querySelectorAll('.node');if(nodes.length){const k=Math.min(nodes.length-1,j+1);nodes.forEach((s,i)=>{s.classList.toggle('on',i<=k);s.classList.toggle('now',i===k);});}
  const text=LESSON.scenes[sceneIdx].narration[j].text;
  if(!voiceOn||!synth){setTimeout(res,Math.min(6000,1200+text.length*55));return;}
  const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';const v=pickVoice();if(v)u.voice=v;u.rate=1.0;u.onend=res;u.onerror=res;synth.speak(u);});}
async function playFrom(sceneIdx,only=false){stopAll();speaking=true;for(let i=sceneIdx;i<LESSON.scenes.length&&speaking;i++){for(let j=0;j<LESSON.scenes[i].narration.length&&speaking;j++)await speakLine(i,j);if(only)break;}speaking=false;}
function stopAll(){speaking=false;if(synth)synth.cancel();}
document.getElementById('playAll').addEventListener('click',()=>playFrom(0));
document.getElementById('stopAll').addEventListener('click',()=>{stopAll();clearNow();});
document.getElementById('voiceToggle').addEventListener('click',e=>{voiceOn=!voiceOn;e.currentTarget.setAttribute('aria-pressed',String(voiceOn));e.currentTarget.textContent=voiceOn?'음성 켜짐':'음성 꺼짐(자막만)';if(!voiceOn&&synth)synth.cancel();});
document.querySelectorAll('.playScene').forEach(b=>b.addEventListener('click',()=>playFrom(+b.dataset.i,true)));
if(synth&&synth.onvoiceschanged!==undefined)synth.onvoiceschanged=()=>{};
</script>
